<!doctype html>
<html><head><meta charset="utf-8"><title>Jepret tests</title></head>
<body><pre id="out">running</pre>
<script type="module">
import * as core from "./core.js";
import { DICTIONARY, LOCATIONS } from "./vocab.js";
const results = [];
const check = (name, condition) => results.push(`${condition ? "PASS" : "FAIL"} ${name}`);

const w = 64;
const h = 64;
const noisy = new Float32Array(w * h).map((_, i) => (i * 7919) % 255);
const flat = new Float32Array(w * h).fill(128);
check("noise is sharper than flat", core.sharpness(noisy, w, h).score > core.sharpness(flat, w, h).score);
check("flat image is all copy space", core.sharpness(flat, w, h).flatShare === 1);

const ramp = new Float32Array(72).map((_, i) => i % 9);
const hashA = core.differenceHash(ramp);
check("ramp hash has all bits set", core.hammingDistance(hashA, 0n) === 64);
check("identical hashes distance 0", core.hammingDistance(hashA, hashA) === 0);

const photos = [
  { name: "a.jpg", megapixels: 24, sharpness: 900, hash: 0n },
  { name: "b.jpg", megapixels: 24, sharpness: 400, hash: 1n },
  { name: "c.jpg", megapixels: 24, sharpness: 5, hash: 2n ** 40n - 1n },
  { name: "d.jpg", megapixels: 1, sharpness: 800, hash: 2n ** 63n },
  { name: "e.jpg", megapixels: 24, sharpness: 700, hash: 2n ** 64n - 1n },
];
core.judge(photos);
check("sharp first frame kept", photos[0].status === "keep");
check("near-duplicate rejected", photos[1].status === "duplicate");
check("blurry rejected", photos[2].status === "blurry");
check("small rejected", photos[3].status === "small");
check("different scene kept", photos[4].status === "keep");

const scenes = [
  { name: "s1.jpg", megapixels: 24, sharpness: 900, hash: 0n, time: 0 },
  { name: "s2.jpg", megapixels: 24, sharpness: 950, hash: 1n, time: 45 * 60000 },
];
core.judge(scenes);
check("similar photos 45 min apart are not duplicates", scenes.every((p) => p.status === "keep"));

const groups = core.groupByTime([{ time: 0 }, { time: 60000 }, { time: 60000 * 30 }]);
check("two scenes from 30 min gap", groups.length === 2 && groups[0].photos.length === 2);

const meta = core.buildMetadata({ words: "barelang bridge sunrise", locationKey: "batam", people: false, orientation: "horizontal", colours: ["orange"], copySpace: true }, DICTIONARY, LOCATIONS);
check("title has location", meta.title === "Barelang bridge sunrise in Batam, Indonesia");
check("user words first", meta.keywords[0] === "barelang" && meta.keywords[1] === "bridge");
check("location keywords added", meta.keywords.includes("riau islands"));
check("dictionary expansion", meta.keywords.includes("golden hour") && meta.keywords.includes("architecture"));
check("no people tags", meta.keywords.includes("no people"));
check("copy space tag", meta.keywords.includes("copy space"));
check("outdoors tag", meta.keywords.includes("outdoors"));
check("keywords unique and <= 49", new Set(meta.keywords).size === meta.keywords.length && meta.keywords.length <= 49);
check("category from words", [2, 11].includes(meta.category));
const food = core.buildMetadata({ words: "nasi goreng street food", locationKey: "", people: true, orientation: "vertical", colours: [] }, DICTIONARY, LOCATIONS);
check("food category 7", food.category === 7);
check("phrase consumes its words", !food.keywords.includes("traffic") && !food.keywords.includes("road"));
check("multi-word entries matched", food.keywords.includes("fried rice") && food.keywords.includes("hawker"));

const items = [{ file: "DSC01.JPG", title: 'Bridge, "sunrise"', keywords: meta.keywords, category: meta.category, editorial: false, shutterstockCategories: ["Nature"] }];
const adobe = core.adobeCsv(items);
check("adobe header", adobe.startsWith("Filename,Title,Keywords,Category,Releases\r\n"));
check("csv quotes escaped", adobe.includes('"Bridge, ""sunrise"""'));
const shutter = core.shutterstockCsv(items);
check("shutterstock header", shutter.startsWith("Filename,Description,Keywords,Categories,Editorial,Mature content,illustration"));
check("valid item has no problems", core.validateItem(items[0]).length === 0);
check("long filename flagged", core.validateItem({ ...items[0], file: "x".repeat(31) + ".jpg" }).length === 1);

// ---- EXIF shooting time (phone transfers reset the file date)
function fakeJpeg(dateText, littleEndian, useExifIfd = true) {
  const tiff = [];
  const u16 = (v) => (littleEndian ? [v & 255, v >> 8] : [v >> 8, v & 255]);
  const u32 = (v) => (littleEndian
    ? [v & 255, (v >> 8) & 255, (v >> 16) & 255, v >>> 24]
    : [v >>> 24, (v >> 16) & 255, (v >> 8) & 255, v & 255]);
  const text = [...dateText].map((c) => c.charCodeAt(0)).concat([0]);
  // TIFF header (8) + IFD0 with 1 entry (2 + 12 + 4 = 18) => next block at 26
  tiff.push(...(littleEndian ? [0x49, 0x49] : [0x4d, 0x4d]), ...u16(42), ...u32(8));
  if (useExifIfd) {
    tiff.push(...u16(1), ...u16(0x8769), ...u16(4), ...u32(1), ...u32(26), ...u32(0));
    // Exif IFD at 26 with 1 entry => string at 44
    tiff.push(...u16(1), ...u16(0x9003), ...u16(2), ...u32(text.length), ...u32(44), ...u32(0));
  } else {
    tiff.push(...u16(1), ...u16(0x0132), ...u16(2), ...u32(text.length), ...u32(26), ...u32(0));
  }
  tiff.push(...text);
  const app1 = [0x45, 0x78, 0x69, 0x66, 0, 0, ...tiff];
  const length = app1.length + 2;
  return new Uint8Array([0xff, 0xd8, 0xff, 0xe1, length >> 8, length & 255, ...app1, 0xff, 0xd9]).buffer;
}
const expected = new Date(2026, 10, 8, 7, 15, 30).getTime();
check("exif big-endian DateTimeOriginal", core.exifTime(fakeJpeg("2026:11:08 07:15:30", false)) === expected);
check("exif little-endian DateTimeOriginal", core.exifTime(fakeJpeg("2026:11:08 07:15:30", true)) === expected);
check("exif falls back to DateTime", core.exifTime(fakeJpeg("2026:11:08 07:15:30", true, false)) === expected);
check("no exif gives null", core.exifTime(new Uint8Array([0xff, 0xd8, 0xff, 0xda, 0, 2]).buffer) === null);
check("not a jpeg gives null", core.exifTime(new Uint8Array([1, 2, 3, 4]).buffer) === null);
check("blank exif date gives null", core.exifTime(fakeJpeg("0000:00:00 00:00:00", false)) === null);

// ---- Sony phone-transfer "2M" copies
const mp = (values) => values.map((megapixels) => ({ megapixels }));
check("2M copies detected", core.looksLikePhoneCopies(mp([2.0, 2.1, 2.0, 24.0])));
check("full-size photos not flagged", !core.looksLikePhoneCopies(mp([24.0, 24.0, 6.0])));
check("one small photo not flagged", !core.looksLikePhoneCopies(mp([2.0, 24.0, 24.0])));

const failed = results.filter((line) => line.startsWith("FAIL")).length;
document.getElementById("out").textContent = results.join("\n") + `\nSUMMARY ${results.length - failed}/${results.length} passed`;
if (location.search.includes("report")) {
  fetch("/report", { method: "POST", body: document.getElementById("out").textContent });
}
</script></body></html>
