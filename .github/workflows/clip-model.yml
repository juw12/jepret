name: Scene recogniser model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vocab.js"
      - "tools/build_clip.py"
      - ".github/workflows/clip-model.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install onnxruntime tokenizers numpy pillow huggingface_hub
      - name: Build model files
        run: python tools/build_clip.py
      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update scene recogniser model files [skip ci]"
            git pull --rebase origin main
            git push
          fi
